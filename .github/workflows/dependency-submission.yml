name: Dependency Submission

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Use minimal settings for dependency scan
        run: |
          cp settings.gradle settings.gradle.backup

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven {
                      name = "NeoForged"
                      url = "https://maven.neoforged.net/releases"
                  }
                  maven {
                      name = "Fabric"
                      url = "https://maven.fabricmc.net/"
                  }
                  maven {
                      name = "MinecraftForge"
                      url = "https://maven.minecraftforge.net/"
                  }
                  maven {
                      url = "https://maven.parchmentmc.org"
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = "LinearReader-workspace"

          include(":targets")
          project(":targets").projectDir = file("modules/targets")

          include(":targets:forge_1_20_to_1_20_1")
          project(":targets:forge_1_20_to_1_20_1").projectDir = file("modules/targets/forge_1_20_to_1_20_1")

          include(":targets:fabric_1_20_to_1_20_1")
          project(":targets:fabric_1_20_to_1_20_1").projectDir = file("modules/targets/fabric_1_20_to_1_20_1")

          include(":targets:neoforge_1_20_2_to_1_20_4")
          project(":targets:neoforge_1_20_2_to_1_20_4").projectDir = file("modules/targets/neoforge_1_20_2_to_1_20_4")
          EOF

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v4