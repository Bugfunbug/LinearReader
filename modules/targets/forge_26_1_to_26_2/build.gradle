import java.util.Properties

plugins {
    id 'java'
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '7.0.+'
}

def targetProperties = new Properties()
file('gradle.properties').withInputStream(targetProperties.&load)

def targetProperty = { String name ->
    def value = targetProperties.getProperty(name)
    if (value == null) {
        throw new GradleException("Missing target property '${name}' in ${projectDir}/gradle.properties")
    }
    value
}

def minecraftVersion = targetProperty('minecraft_version')
def minecraftVersionRange = targetProperty('minecraft_version_range')
def minecraftVersionRangeLabel = targetProperty('minecraft_version_range_label')
def forgeVersion = targetProperty('forge_version')
def forgeVersionRange = targetProperty('forge_version_range')
def loaderVersionRange = targetProperty('loader_version_range')
def mappingChannel = targetProperty('mapping_channel')
def mappingVersion = targetProperty('mapping_version')
def modId = targetProperty('mod_id')
def modName = targetProperty('mod_name')
def modLicense = targetProperty('mod_license')
def modAuthors = targetProperty('mod_authors')
def modDescription = targetProperty('mod_description')
def zstdVersion = '1.5.7-13'
def brotliVersion = '1.23.0'

version = targetProperty('mod_version')
group = targetProperty('mod_group_id')

def artifactStem = "${modId}-${project.version}-forge-${minecraftVersionRangeLabel}"

base {
    archivesName = modId
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def workspaceRoot = rootProject.file('modules/core').exists()
        ? rootProject.projectDir
        : projectDir.parentFile.parentFile.parentFile

sourceSets {
    main {
        java.setSrcDirs([])
        java.srcDir new File(projectDir, 'src/main/java')
        java.srcDir new File(workspaceRoot, 'modules/core/src/main/java')
        java.srcDir new File(workspaceRoot, 'modules/minecraft-api/src/main/java')
        java.srcDir new File(workspaceRoot, 'modules/minecraft-families/mc_26_1_to_26_2/src/main/java')
        java.srcDir new File(workspaceRoot, 'modules/loader-families/src/main/java')
        java.srcDir new File(workspaceRoot, 'modules/loader-families/forge_1_21_11_to_26_2/src/main/java')
        java.srcDir new File(workspaceRoot, 'modules/targets/src/main/java')
    }
    test {
        java.srcDir rootProject.file('modules/loader-families/forge_1_21_11_to_26_2/src/test/java')
    }
}

configurations {
    zstdRuntime
    brotliRuntime
}

minecraft {
    mappings channel: mappingChannel, version: mappingVersion
    runs {
        configureEach {
            workingDir = project.file('run')

            systemProperties.set([
                    'forge.logging.markers': 'REGISTRIES',
                    'forge.logging.console.level': 'debug'
            ])

            args.add('-mixin.config=linearreader.mixins.json')

            mods {
                "${modId}" {
                    source sourceSets.main
                }
            }
        }

        client {
            systemProperties.putAll([
                    'mixin.debug.export': 'true',
                    'mixin.debug.verbose': 'true'
            ])
        }

        server {
            args.add('--nogui')
        }
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraftVersion}-${forgeVersion}")

    compileOnly 'org.spongepowered:mixin:0.8.7'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testRuntimeOnly "com.github.luben:zstd-jni:${zstdVersion}"

    zstdRuntime "com.github.luben:zstd-jni:${zstdVersion}"

    brotliRuntime "com.aayushatharva.brotli4j:brotli4j:${brotliVersion}"
    brotliRuntime "com.aayushatharva.brotli4j:native-linux-x86_64:${brotliVersion}"
    brotliRuntime "com.aayushatharva.brotli4j:native-linux-aarch64:${brotliVersion}"
    brotliRuntime "com.aayushatharva.brotli4j:native-windows-x86_64:${brotliVersion}"
    brotliRuntime "com.aayushatharva.brotli4j:native-osx-x86_64:${brotliVersion}"
    brotliRuntime "com.aayushatharva.brotli4j:native-osx-aarch64:${brotliVersion}"
}

tasks.withType(JavaCompile).configureEach {
    exclude { details ->
        details.file == rootProject.file(
                'modules/core/src/main/java/com/bugfunbug/linearreader/linear/LinearBackedRegionFile.java')
    }
    options.compilerArgs.addAll([
            '-encoding', 'UTF-8'
    ])
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    minecraft.mavenizer repositories

    exclusiveContent {
        forRepository {
            // Tell Gradle to pull the legitimate file from Maven Central instead of your local disk
            mavenCentral()
        }
        filter {
            includeModule('org.lwjgl', 'lwjgl-freetype')
        }
    }

    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }

    mavenCentral()
}

tasks.named('processTestResources', ProcessResources).configure {
    from(configurations.zstdRuntime) {
        into 'META-INF/linearreader-libs'
        rename { 'zstd-jni.jar' }
    }
    from(configurations.brotliRuntime) {
        into 'META-INF/linearreader-libs'
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    archiveFileName.set("${artifactStem}.jar")
}

jar {
    // Ship zstd-jni as a nested resource jar and load it through an isolated
    // classloader at runtime. This keeps com.github.luben.zstd out of the
    // Minecraft module layer while preserving the original JNI class names.
    from(configurations.zstdRuntime) {
        into 'META-INF/linearreader-libs'
        rename { 'zstd-jni.jar' }
    }
    from(configurations.brotliRuntime) {
        into 'META-INF/linearreader-libs'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(rootProject.file('LICENSE')) {
        rename { 'LICENSE.txt' }
        into '/'
    }
    from(rootProject.file('README.md')) { into '/' }

    manifest {
        attributes([
                'Specification-Title': modId,
                'Specification-Vendor': modAuthors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': modAuthors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs': "${modId}.mixins.json"
        ])
    }
    finalizedBy tasks.matching { it.name == 'reobfJar' }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraftVersion,
            minecraft_version_range: minecraftVersionRange,
            forge_version: forgeVersion,
            forge_version_range: forgeVersionRange,
            loader_version_range: loaderVersionRange,
            mod_id: modId,
            mod_name: modName,
            mod_license: modLicense,
            mod_version: project.version,
            mod_authors: modAuthors,
            mod_description: modDescription,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}
