import org.gradle.util.GradleVersion

plugins {
    id 'base'
}

def targetOrNull = { String path ->
    findProject(path)
}

def requireIncludedTarget = { String label, Project target ->
    if (target == null) {
        throw new GradleException("${label} is not included in this Gradle runtime. "
                + "Use Gradle 8 for Forge/NeoForge targets and Gradle 9 for Fabric 26.1.x.")
    }
}

def fabric1201Target = targetOrNull(':targets:fabric_1_20_to_1_20_1')
def fabric1202To1214Target = targetOrNull(':targets:fabric_1_20_2_to_1_21_4')
def fabric1215To12110Target = targetOrNull(':targets:fabric_1_21_5_to_1_21_10')
def fabric12111Target = targetOrNull(':targets:fabric_1_21_11')
def fabric261To2612Target = targetOrNull(':targets:fabric_26_1_to_26_1_2')
def forge1201Target = targetOrNull(':targets:forge_1_20_to_1_20_1')
def neoforge1211Target = targetOrNull(':targets:neoforge_1_21_1')

def fabricTargets = [
        fabric1201Target,
        fabric1202To1214Target,
        fabric1215To12110Target,
        fabric12111Target,
        fabric261To2612Target
].findAll { it != null }

def forgeNeoForgeTargets = [forge1201Target, neoforge1211Target].findAll { it != null }
def liveTargets = fabricTargets + forgeNeoForgeTargets

def dependsOnTask = { Task task, List<Project> targets, String taskName ->
    targets.each { target ->
        task.dependsOn target.tasks.named(taskName)
    }
}

tasks.register('compileAll') {
    group = 'linearreader'
    description = 'Compiles all live targets for this Gradle runtime.'
    dependsOnTask(delegate, liveTargets, 'compileJava')
}

tasks.register('compileFabric') {
    group = 'linearreader'
    description = 'Compiles all live Fabric targets for this Gradle runtime.'
    dependsOnTask(delegate, fabricTargets, 'compileJava')
}

tasks.register('compileForgeNeoForge') {
    group = 'linearreader'
    description = 'Compiles all live Forge and NeoForge targets for this Gradle runtime.'
    dependsOn tasks.named('compileForge')
    dependsOn tasks.named('compileNeoForge')
}

tasks.register('compileForge') {
    group = 'linearreader'
    description = 'Compiles the Forge target.'
    if (forge1201Target != null) {
        dependsOn forge1201Target.tasks.named('compileJava')
    }
    doFirst {
        requireIncludedTarget('Forge target', forge1201Target)
    }
}

tasks.register('compileNeoForge') {
    group = 'linearreader'
    description = 'Compiles the NeoForge target.'
    if (neoforge1211Target != null) {
