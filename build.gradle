tasks.named('build').configure {
    dependsOn tasks.named('buildAll')
}

tasks.named('clean').configure {
    dependsOn tasks.named('cleanAll')
}

tasks.named('check').configure {
    dependsOn tasks.named('testAll')
}

tasks.register('collectJars', Copy) {
    group = 'linearreader'
    description = 'Collects built mod jars from all live loader targets into root/build/collected-jars.'
    dependsOn tasks.named('buildAll')
    into layout.buildDirectory.dir('collected-jars')

    fabricTargets.each { target ->
        from(target.layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-sources.jar', '*-javadoc.jar'
            into target.name
        }
    }

    forgeNeoForgeTargets.each { target ->
        from(target.layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-sources.jar', '*-javadoc.jar'
            into target.name
        }
    }
}

def gradle9DelegateAvailable = GradleVersion.current() < GradleVersion.version('9.0')
        && rootProject.file('gradlew9').exists()

if (gradle9DelegateAvailable) {
    def gradleUserHome = System.getenv('GRADLE_USER_HOME')
            ?: rootProject.file('.gradle-user-home').absolutePath

    def registerGradle9Delegate = { String taskName ->
        def delegateTaskName = "gradle9${taskName.capitalize()}"
        tasks.register(delegateTaskName, Exec) {
            group = 'linearreader'
            description = "Runs '${taskName}' for Gradle 9 targets (Fabric 26.1.x)."
            workingDir rootProject.projectDir
            environment 'GRADLE_USER_HOME', gradleUserHome
            commandLine rootProject.file('gradlew9').absolutePath, taskName
        }
        tasks.named(taskName).configure {
            dependsOn delegateTaskName
        }
    }

    registerGradle9Delegate('cleanAll')
    registerGradle9Delegate('buildAll')
    registerGradle9Delegate('testAll')

    tasks.register('gradle9CollectJars', Copy) {
        group = 'linearreader'
        description = 'Merges Fabric 26.1.x jars into collected-jars without replacing other targets.'
        dependsOn tasks.named('gradle9BuildAll')
        from(rootProject.layout.projectDirectory.dir('modules/targets/fabric_26_1_to_26_1_2/build/libs')) {
            include '*.jar'
            exclude '*-sources.jar', '*-javadoc.jar'
        }
        into layout.buildDirectory.dir('collected-jars/fabric_26_1_to_26_1_2')
    }

    tasks.named('collectJars').configure {
        finalizedBy tasks.named('gradle9CollectJars')
    }
}
